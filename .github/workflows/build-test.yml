name: Build and Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  BUILD_TYPE: Debug

jobs:
  test:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip-ci')"
    timeout-minutes: 30
    strategy:
      matrix:
        llvm: ['21', '22', '23']

    steps:
    - name: Install LLVM and Clang
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh ${{matrix.llvm}}

    - name: Checkout YuLang
      uses: actions/checkout@v2
      with:
        submodules: recursive

    - name: Check C/C++ Formatting
      if: matrix.llvm == '23'
      shell: bash
      run: |
        sudo apt-get install -y clang-format-23
        clang-format-23 --version
        git ls-files -z -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' '*.inc' |
          xargs -0 clang-format-23 --style=file --dry-run --Werror --fail-on-incomplete-format

    - name: Create Build Environment
      run: cmake -E make_directory ${{runner.workspace}}/build

    - name: Configure CMake
      working-directory: ${{runner.workspace}}/build
      shell: bash
      env:
        CC: clang-${{matrix.llvm}}
        CXX: clang++-${{matrix.llvm}}
      run: >-
        cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        -DLLVM_DIR="$(llvm-config-${{matrix.llvm}} --cmakedir)"

    - name: Check C/C++ Static Analysis
      if: matrix.llvm == '23'
      shell: bash
      run: |
        sudo apt-get install -y clang-tidy-23
        clang-tidy-23 --version
        clang-tidy-23 --verify-config
        run-clang-tidy-23 -clang-tidy-binary clang-tidy-23 \
          -p "${{runner.workspace}}/build" -j 2
        # Native regression helpers are compiled by Python, outside CMake.
        clang-tidy-23 tests/backend/check_zeros.c tests/runtime/*.c -- -std=c11

    - name: Build
      working-directory: ${{runner.workspace}}/build
      shell: bash
      run: cmake --build . --parallel 2

    - name: Test
      working-directory: ${{runner.workspace}}/build
      run: ctest --output-on-failure
